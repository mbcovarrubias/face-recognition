<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="box" style="max-height:">
			<h3 class="center">Registration</h3>
			<form name="registration" action="/" method="post" id="regForm" onsubmit="window.resizeTo(700,450); window.moveTo((screen.width-700)/2,(screen.height-450)/2);">
				<input type="text" name="name" id="name" placeholder="Name" autocomplete="off" required>
				<p id="error"></p>
				<hr/>
				<button type="submit" id="next" disabled>Next</button>
			</form>
			<script>
				document.getElementById("name").addEventListener("keyup",async ()=>{
					try {
						const response = await fetch("/checkUsername",{
							method: "POST",
							headers: {
								"Content-Type": "application/json"
							},
							body: JSON.stringify({ name: document.getElementById("name").value })
						});
						
						const result = await response.json();
						document.getElementById("next").disabled = result.alreadyExists || document.getElementById("name").value.trim() == "";
					} catch (err) {
						console.error(err);
					}
				});
			</script>
		</div>
	</body>
</html>
